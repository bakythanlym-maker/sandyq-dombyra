                                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                                    {history.map(item => (
                                        <div key={item.id} className="tuning-btn" onClick={() => loadFromHistory(item)} style={{ justifyContent: 'space-between', padding: '16px 20px' }}>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                                                <span style={{ color: 'var(--text-color)', fontWeight: 800 }}>{item.name}</span>
                                                <small style={{ color: '#666', fontSize: '10px' }}>{item.date} • {item.duration.toFixed(1)}s</small>
                                            </div>
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div style={{ textAlign: 'center', padding: '60px 0', opacity: 0.3 }}>Тарих бос</div>
                            )}
                        </div>
                    )}

                    {activeTab === 'tuner' && (() => {
                        const tMap = tunings[tuning] || tunings.DG;
                        const hearing = tunerFreq > 0;
                        const inTune = hearing && Math.abs(tunerCents) <= 5;
                        const isSharp = hearing && tunerCents > 5;
                        const isFlat = hearing && tunerCents < -5;
                        const toneClass = !hearing ? 'silent' : (inTune ? 'in-tune' : (isSharp ? 'sharp' : 'flat'));
                        // GuitarTuna: cents > 0 (sharp) → bubble RIGHT → "Tune down!"
                        //             cents < 0 (flat)  → bubble LEFT  → "Tune up!"
                        const meterPx = hearing ? Math.max(-130, Math.min(130, (tunerCents / 50) * 130)) : 0;
                        const centsShown = hearing ? Math.min(99, Math.abs(Math.round(tunerCents))) : 0;
                        const tipText = !hearing
                            ? (tunerActive ? 'Play a string' : 'Tap to start')
                            : (inTune ? 'In tune!' : (isSharp ? 'Tune down!' : 'Tune up!'));
                        const targetLabel = (() => {
                            const hz = tMap[selectedString.toLowerCase()];
                            const info = getNoteFromFrequency(hz);
                            const raw = info.note || selectedString;
                            const m = raw.match(/^([A-G]#?)(-?\d+)$/);
                            if (!m) return raw;
                            const sub = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'][Number(m[2])] || m[2];
                            return `${m[1]}${sub}`;
                        })();
                        const ticks = [];
                        for (let i = -10; i <= 10; i++) ticks.push(i);

                        return (
                            <div className="gt-stage" onClick={() => { if (!tunerActive) startTuner(); }}>
                                <button
                                    className={`gt-mic-btn ${tunerActive ? 'live' : ''}`}
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        tunerActive ? stopTuner() : startTuner();
                                    }}
                                >
                                    {tunerActive ? '● Live' : 'Mic'}
                                </button>

                                <div className="gt-ruler" aria-hidden="true">
                                    {ticks.map((i) => (
                                        <span
                                            key={i}
                                            className={i === 0 ? 'center' : (i % 5 === 0 ? 'major' : 'minor')}
                                        />
                                    ))}
                                </div>

                                {/* Moving cents bubble: right = too high, left = too low */}
                                <div
                                    className={`gt-cents-meter ${toneClass}`}
                                    style={{ transform: `translateX(calc(-50% + ${meterPx}px))` }}
                                >
                                    <div className="gt-cents-bubble">{centsShown}</div>
                                    <div className="gt-cents-caret" />
                                </div>

                                <div className={`gt-tip show ${toneClass}`}>
                                    {tipText}
                                </div>

                                {/* Fixed center = perfect pitch */}
                                <div className="gt-needle">
                                    <div className="gt-center-line" />
                                    <div className={`gt-target-bubble ${inTune ? 'in-tune' : ''}`}>
                                        {targetLabel}
                                    </div>
                                </div>

                                <div className="gt-board">
                                    <button
                                        className={`gt-note-bubble ${selectedString === 'D' ? 'active' : ''} ${selectedString === 'D' && inTune ? 'in-tune-glow' : ''}`}
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            setSelectedString('D');
                                            setTunerMode('string');
                                            unlockAudioEngine();
                                            playSynth(tMap.d);
                                        }}
                                        title={`D · ${tMap.d.toFixed(1)} Hz`}
                                    >D</button>

                                    <svg className="gt-headstock" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
                                                <stop offset="0%" stopColor="#c4a574" />
                                                <stop offset="45%" stopColor="#a67c52" />
                                                <stop offset="100%" stopColor="#8b5a2b" />
                                            </linearGradient>
                                            <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="0%" stopColor="#f3f4f6" />
                                                <stop offset="50%" stopColor="#c0c4c8" />
                                                <stop offset="100%" stopColor="#9ca3af" />
                                            </linearGradient>
                                            <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
                                                <feDropShadow dx="0" dy="6" stdDeviation="4" floodOpacity="0.35" />
                                            </filter>
                                        </defs>
                                        <path
                                            d="M70 18 C70 18 110 8 150 18 L168 55 C175 70 178 95 176 120 L170 210 C168 235 150 248 110 252 C70 248 52 235 50 210 L44 120 C42 95 45 70 52 55 Z"
                                            fill="#f5f0e6"
                                            filter="url(#soft)"
                                        />
                                        <path
                                            d="M76 26 C76 26 110 16 144 26 L160 58 C166 72 169 95 167 118 L161 208 C159 228 145 238 110 242 C75 238 61 228 59 208 L53 118 C51 95 54 72 60 58 Z"
                                            fill="url(#wood)"
                                        />
                                        <rect x="98" y="48" width="6" height="70" rx="2" fill="#3f2a14" opacity="0.85" />
                                        <rect x="116" y="48" width="6" height="70" rx="2" fill="#3f2a14" opacity="0.85" />
                                        <rect x="78" y="236" width="64" height="8" rx="2" fill="#e7e2d6" />
                                        <line x1="101" y1="55" x2="96" y2="240" stroke="#d1d5db" strokeWidth="1.4" />
                                        <line x1="119" y1="55" x2="124" y2="240" stroke="#d1d5db" strokeWidth="1.4" />
                                        <ellipse cx="48" cy="70" rx="14" ry="9" fill="url(#chrome)" transform="rotate(-18 48 70)" />
                                        <circle cx="58" cy="66" r="6" fill="#9ca3af" stroke="#e5e7eb" strokeWidth="1" />
                                        <ellipse cx="46" cy="110" rx="14" ry="9" fill="url(#chrome)" transform="rotate(-12 46 110)" />
                                        <circle cx="56" cy="108" r="6" fill="#9ca3af" stroke="#e5e7eb" strokeWidth="1" />
                                        <ellipse cx="46" cy="150" rx="14" ry="9" fill="url(#chrome)" transform="rotate(-8 46 150)" />
                                        <circle cx="56" cy="150" r="6" fill="#9ca3af" stroke="#e5e7eb" strokeWidth="1" />
                                        <ellipse cx="172" cy="70" rx="14" ry="9" fill="url(#chrome)" transform="rotate(18 172 70)" />
                                        <circle cx="162" cy="66" r="6" fill="#9ca3af" stroke="#e5e7eb" strokeWidth="1" />
                                        <ellipse cx="174" cy="110" rx="14" ry="9" fill="url(#chrome)" transform="rotate(12 174 110)" />
                                        <circle cx="164" cy="108" r="6" fill="#9ca3af" stroke="#e5e7eb" strokeWidth="1" />
                                        <ellipse cx="174" cy="150" rx="14" ry="9" fill="url(#chrome)" transform="rotate(8 174 150)" />
                                        <circle cx="164" cy="150" r="6" fill="#9ca3af" stroke="#e5e7eb" strokeWidth="1" />
                                        <circle cx="58" cy="66" r="3" fill="#e5e7eb" />
                                        <circle cx="162" cy="66" r="3" fill="#e5e7eb" />
                                        {/* Active string marker at nut */}
                                        {selectedString === 'D' && (
                                            <g>
                                                <circle cx="96" cy="248" r="12" fill="#fff" />
                                                <text x="96" y="252" textAnchor="middle" fontSize="12" fontWeight="800" fill="#111">D</text>
                                            </g>
                                        )}
                                        {selectedString === 'G' && (
                                            <g>
                                                <circle cx="124" cy="248" r="12" fill="#fff" />
                                                <text x="124" y="252" textAnchor="middle" fontSize="12" fontWeight="800" fill="#111">G</text>
                                            </g>
                                        )}
                                    </svg>

                                    <button
                                        className={`gt-note-bubble ${selectedString === 'G' ? 'active' : ''} ${selectedString === 'G' && inTune ? 'in-tune-glow' : ''}`}
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            setSelectedString('G');
                                            setTunerMode('string');
                                            unlockAudioEngine();
                                            playSynth(tMap.g);
                                        }}
                                        title={`G · ${tMap.g.toFixed(1)} Hz`}
                                    >G</button>
                                </div>
                            </div>
                        );
                    })()}

                    {activeTab === 'star' && (
                        <div className="card">
                            <h3 className="card-title">Таңдамалы Музыкалар</h3>
                            {favorites.length > 0 ? (
                                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                                    {favorites.map(item => (
                                        <div key={item.id} className="tuning-btn" style={{ justifyContent: 'space-between', padding: '16px 20px' }}>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, flex: 1 }} onClick={() => loadFromHistory(item)}>
                                                <span style={{ color: 'var(--text-color)', fontWeight: 800 }}>{item.name}</span>
                                                <small style={{ color: '#666', fontSize: '10px' }}>{item.date} • {item.duration.toFixed(1)}s</small>
                                            </div>
                                            <button
                                                onClick={(e) => { e.stopPropagation(); toggleFavorite(item); }}
                                                style={{ background: 'transparent', border: 'none', color: '#ffaa33', cursor: 'pointer' }}
                                            >
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div style={{ textAlign: 'center', padding: '60px 0', opacity: 0.3 }}>Таңдамалылар бос</div>
                            )}
                        </div>
                    )}

                    {activeTab === 'settings' && (
                        <div className="card">
                            <h3 className="card-title">Параметрлер</h3>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
                                <div>
                                    <h4 style={{ fontSize: '12px', color: '#666', marginBottom: 12, textTransform: 'uppercase' }}>Тақырып (Theme)</h4>
                                    <div style={{ display: 'flex', gap: 10 }}>
                                        <button className={`tuning-btn ${theme === 'dark' ? 'active' : ''}`} onClick={() => setTheme('dark')} style={{ flex: 1, justifyContent: 'center' }}>Қараңғы</button>
                                        <button className={`tuning-btn ${theme === 'light' ? 'active' : ''}`} onClick={() => setTheme('light')} style={{ flex: 1, justifyContent: 'center' }}>Жарық</button>
                                    </div>
                                </div>
                                <div>
                                    <h4 style={{ fontSize: '12px', color: '#666', marginBottom: 12, textTransform: 'uppercase' }}>Тіл (Language)</h4>
                                    <div style={{ display: 'flex', gap: 10 }}>
                                        <button className={`tuning-btn ${language === 'kk' ? 'active' : ''}`} onClick={() => setLanguage('kk')} style={{ flex: 1, justifyContent: 'center' }}>Қазақша</button>
                                        <button className={`tuning-btn ${language === 'en' ? 'active' : ''}`} onClick={() => setLanguage('en')} style={{ flex: 1, justifyContent: 'center' }}>English</button>
                                    </div>
                                </div>
                                <div>
                                    <h4 style={{ fontSize: '12px', color: '#666', marginBottom: 5, textTransform: 'uppercase' }}>Деректер</h4>
                                    <button className="record-btn secondary" onClick={() => {
                                        if (confirm('Барлық тарих пен таңдамалыларды өшіру керек пе?')) {
                                            setHistory([]);
                                            setFavorites([]);
                                            localStorage.clear();
                                            alert('Деректер өшірілді');
                                        }
                                    }}>Барлық деректерді тазалау</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="card" style={{ padding: '16px', marginBottom: 80 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                                <h3 className="card-title" style={{ margin: 0 }}>Уақыт Сызығы</h3>
                                <button className={`synth-play-btn ${!isPlaying ? 'inactive' : ''}`}
                                    onClick={togglePlayback}
                                    style={{
                                        width: '36px',
                                        height: '36px',
                                        borderRadius: '15px',
                                        boxShadow: isPlaying ? '0 0 15px rgba(190, 243, 141, 0.4)' : 'none'
                                    }}
                                    title="Ойнату/Тоқтату">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        {isPlaying ? (
                                            <g><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></g>
                                        ) : (
                                            <polygon points="5 3 19 12 5 21 5 3" />
                                        )}
                                    </svg>
                                </button>
                                <div style={{ display: 'flex', gap: 10, marginLeft: 10 }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                        <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#bef38d' }}></div>
                                        <span style={{ fontSize: 10, fontWeight: 800, color: '#666' }}>G</span>
                                    </div>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                        <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#ffaa33' }}></div>
                                        <span style={{ fontSize: 10, fontWeight: 800, color: '#666' }}>D</span>
                                    </div>
                                </div>
                                <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                                    {[1.0, 1.25, 1.5, 1.75, 2.0].map(speed => (
                                        <button
                                            key={speed}
                                            onClick={() => setPlaybackSpeed(speed)}
                                            style={{
                                                padding: '8px 10px',
                                                borderRadius: 12,
                                                border: '1px solid rgba(255,255,255,0.12)',
                                                background: playbackSpeed === speed ? '#bef38d' : 'transparent',
                                                color: playbackSpeed === speed ? '#0f172a' : '#cbd5e1',
                                                fontWeight: 700,
                                                cursor: 'pointer'
                                            }}
                                        >
                                            x{speed.toString().replace('.0', '')}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            {sequence.length > 0 && (
                                <button
                                    onClick={() => {
                                        const entry = history.find(h => h.sequence === sequence) || {
                                            id: Date.now(),
                                            name: "Жаңа нота",
                                            date: new Date().toLocaleString(),
                                            duration: audioDuration,
                                            sequence: sequence
                                        };
                                        toggleFavorite(entry);
                                    }}
                                    style={{
                                        background: 'transparent',
                                        border: 'none',
                                        color: favorites.some(f => JSON.stringify(f.sequence) === JSON.stringify(sequence)) ? '#ffaa33' : '#444',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: 6,
                                        fontSize: '12px',
                                        fontWeight: '800'
                                    }}
                                >
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill={favorites.some(f => JSON.stringify(f.sequence) === JSON.stringify(sequence)) ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2.5">
                                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                    </svg>
                                    {favorites.some(f => JSON.stringify(f.sequence) === JSON.stringify(sequence)) ? 'ҰНАЙДЫ' : 'ҰНАТУ'}
                                </button>
                            )}
                        </div>
                        <div className="timeline-viewport" ref={timelineRef}>
                            <div className="timeline-content" style={{ width: Math.max(600, audioDuration * PIXELS_PER_SECOND) }} onClick={(e) => {
                                if (!timelineRef.current) return;
                                const rect = e.currentTarget.getBoundingClientRect();
                                const offsetX = e.clientX - rect.left + timelineRef.current.scrollLeft;
                                const newTime = Math.min(audioDuration, Math.max(0, offsetX / PIXELS_PER_SECOND));
                                if (audioRef.current) {
                                    audioRef.current.currentTime = newTime;
                                }
                                currentTimeRef.current = newTime;
                                setCurrentTime(newTime);
                                lastPlayedTimeRef.current = newTime;
                            }}>
                                <div className="playhead" style={{ left: currentTime * PIXELS_PER_SECOND }}></div>

                                <div className="string-line" style={{ top: G_STRING_Y }}></div>
                                <div className="string-label" style={{ top: G_STRING_Y }}>G Ішек</div>

                                <div className="string-line" style={{ top: D_STRING_Y }}></div>
                                <div className="string-label" style={{ top: D_STRING_Y }}>D Ішек</div>

                                {sequence.map((n, i) => (
                                    <div key={i} className={`note-block ${n.s === 'G' ? 'string-g' : 'string-d'} ${currentTime >= n.t && currentTime <= n.t + (n.dur / 1000) ? 'active' : ''}`}
                                        style={{ left: n.t * PIXELS_PER_SECOND, top: n.s === 'G' ? G_STRING_Y : D_STRING_Y, width: Math.max(40, (n.dur / 1000) * PIXELS_PER_SECOND) }}
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            unlockAudioEngine();
                                            playNoteSound(n);
                                        }}
                                        onTouchStart={(e) => {
                                            // preventDefault blocks the follow-up click so the note
                                            // does not ring twice on phones.
                                            e.preventDefault();
                                            e.stopPropagation();
                                            unlockAudioEngine();
                                            playNoteSound(n);
                                        }}
                                        title={`${n.note} (${n.hz}Hz) @ ${n.t.toFixed(2)}s`}>
                                        <span style={{ fontSize: '14px' }}>{n.f}</span>
                                        {(n.dur / 1000) * PIXELS_PER_SECOND > 60 && (
                                            <span style={{ fontSize: '9px', opacity: 0.7, marginLeft: 4 }}>{n.note}</span>
                                        )}
                                        <div className="note-tooltip">{n.note} ({n.hz}Hz)</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        {audioUrl && <audio ref={audioRef} src={audioUrl} controls style={{ marginTop: 16, width: '100%', minHeight: '44px' }} />}
                        {error && <div style={{ color: '#EF4444', fontSize: 12, marginTop: 10, fontWeight: 700 }}>{error}</div>}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
